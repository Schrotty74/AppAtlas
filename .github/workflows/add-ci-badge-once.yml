name: Add CI badge once

on:
  push:
    paths:
      - .github/workflows/add-ci-badge-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add badge and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          badge = '  <a href="https://github.com/Schrotty74/AppAtlas/actions/workflows/ci.yml"><img src="https://github.com/Schrotty74/AppAtlas/actions/workflows/ci.yml/badge.svg" alt="CI"></a>\n'
          marker = '<p align="center">\n  <img src="https://img.shields.io/badge/Swift-6.0-orange?logo=swift" alt="Swift 6.0">'
          if 'actions/workflows/ci.yml/badge.svg' not in s:
              s = s.replace(marker, '<p align="center">\n' + badge + '  <img src="https://img.shields.io/badge/Swift-6.0-orange?logo=swift" alt="Swift 6.0">', 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git rm .github/workflows/add-ci-badge-once.yml
          git commit -m "docs: show CI status badge"
          git push
